name: 🤖 PR Agent Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    name: Review Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run PR Agent Review
        uses: The-PR-Agent/pr-agent@v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: gemini/gemini-3.8-flash
          config.fallback_models: '["gemini/gemini-3.6-flash", "gemini/gemini-3-flash-preview", "gemini/gemini-3.5-flash-lite", "gemini/gemini-3.1-flash-lite", "gemini/gemini-2.5-flash", "gemini/gemini-2.5-flash-lite", "gemini/gemini-3.1-pro-preview"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          github_action_config.fail_on_tool_errors: "true"
          pr_reviewer.require_score_review: "true"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_estimate_effort_to_review: "true"
          pr_reviewer.require_can_be_split_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.require_estimate_contribution_time_cost: "true"
          pr_reviewer.require_todo_scan: "true"
          pr_reviewer.require_ticket_analysis_review: "true"
          pr_reviewer.require_risk_assessment: "true"
          pr_reviewer.require_merge_recommendation: "true"
          pr_reviewer.require_failure_modes: "true"
          pr_reviewer.require_priority_files: "true"
          pr_reviewer.num_max_findings: "10"
          pr_reviewer.inline_key_issues: "true"
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "5"
