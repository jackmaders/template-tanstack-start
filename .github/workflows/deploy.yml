name: 🚀 Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      production-url: ${{ steps.deploy-worker.outputs.production-url }}

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🏗️ Build Application
        run: bun run build

      - name: 🗃️ Apply Production Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate --remote

      - name: 🚀 Deploy Worker
        id: deploy-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
        run: |
          bun run cf:deploy --var "BETTER_AUTH_URL:$BETTER_AUTH_URL"

  e2e-tests:
    name: 🎭 Run E2E Tests (${{ matrix.browser }})
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🎭 Run Browser Tests
        uses: ./.github/actions/run-playwright
        with:
          browser: ${{ matrix.browser }}
          base-url: ${{ vars.PRODUCTION_URL }}
          report-name: playwright-report-production-${{ matrix.browser }}

  lighthouse:
    name: 🔦 Run Lighthouse Check
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🔦 Run Lighthouse Check
        uses: ./.github/actions/run-lighthouse
        with:
          base-url: ${{ vars.PRODUCTION_URL }}
          number-of-runs: "3"
          start-server-command: ""
