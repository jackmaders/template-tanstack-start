name: 🤖 PR Agent Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    name: Review Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run PR Agent Review
        uses: The-PR-Agent/pr-agent@v0.47.0
        env:
          github_action_config.auto_describe: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: gemini/gemini-3.8-flash
          config.max_model_tokens: 64000
          config.fallback_models: '["gemini/gemini-3.6-flash", "gemini/gemini-3-flash-preview", "gemini/gemini-3.5-flash-lite", "gemini/gemini-3.1-flash-lite", "gemini/gemini-2.5-flash", "gemini/gemini-2.5-flash-lite", "gemini/gemini-3.1-pro-preview", "gemini/gemini-2.5-pro"]'
          pr_reviewer.require_merge_recommendation: "true"
          pr_reviewer.num_max_findings: 5
          pr_reviewer.inline_key_issues: "true"
          pr_reviewer.require_can_be_split_review: "true"
