output:
  - summary
  - execution_out
  - failure

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css,scss}"
      run: bun biome check --write {staged_files} || true
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --default-config --edit {1}
